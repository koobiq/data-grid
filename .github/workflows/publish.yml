name: Publish

on:
  push:
    tags:
      # Matches project-scoped tags ({projectName}@{version}), e.g. ag-grid-angular-theme@1.2.3.
      - '*@*.*.*'
  # Allows you to run this workflow manually
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed for provenance data generation
  # https://nx.dev/recipes/nx-release/publish-in-ci-cd#npm-provenance
  id-token: write

jobs:
  publish:
    if: ${{ github.repository_owner == 'koobiq' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: yarn nx release publish --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
