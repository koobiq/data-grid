# Triggered workflow by PR comment: /approve-snapshots
#
# ⚠️ This job checks out and runs PR-controlled code with a repo write token. Only comment
# /approve-snapshots after reviewing the PR's contents — the author_association check below
# only verifies the commenter, not the safety of the code being run.
name: E2E approve snapshots

on:
  issue_comment:
    types: [created]

permissions:
  contents: write # for stefanzweifel/git-auto-commit-action to push changes
  pull-requests: write # for thollander/actions-comment-pull-request to comment on PRs

jobs:
  approve_snapshots:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/approve-snapshots') && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      # The snapshots are pushed to the branch of this repository named after the head branch of the pull request.
      # For a fork that branch lives in another repository and its name may even be `main`; the fork's code would also
      # run with a write token. So a fork is refused before anything is checked out.
      - name: Refuse pull requests from forks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" != false ]; then
            echo '::error::Snapshots of a pull request from a fork are not updated here, run yarn run e2e:docker:update-snapshots instead.'
            exit 1
          fi
      - uses: xt0rted/pull-request-comment-branch@e8b8daa837e8ea7331c0003c9c316a64c6d8b0b1 # v3.0.0
        id: comment-branch
      # The comment approves the code its author reviewed, but the head SHA above is read after the comment: a commit
      # pushed in between would run unreviewed with the write token. GitHub sets `pushed_at` on every push, unlike the
      # date of a commit, which its author picks. A push to the repository after the comment stops the job, even to
      # another branch; comment again to rerun it.
      - name: Refuse commits pushed after the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
        run: |
          pushed_at=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.repo.pushed_at)
          if [[ -z $pushed_at ]]; then
            echo '::error::The time of the last push to the pull request branch is unknown.'
            exit 1
          fi
          if [[ $(date -d "$pushed_at" +%s) -gt $(date -d "$COMMENT_AT" +%s) ]]; then
            echo '::error::The repository was pushed to after the comment. Review the pull request again and comment once more.'
            exit 1
          fi
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: 🔄 [Updating](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) snapshots.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.comment-branch.outputs.head_sha }}
      - run: npm run e2e:docker:update-snapshots
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        id: commit-and-push
        with:
          commit_message: 'test: updated e2e snapshots'
          file_pattern: '**/*.png **/*.txt'
          # The checkout above is a detached HEAD at the commit the snapshots were taken from, and the comment event
          # has no `github.head_ref` for the default `branch`. Without a branch the action runs a bare `git push`,
          # which fails there. Commit on top of that HEAD and push it to the branch of the pull request: if the branch
          # moved meanwhile, the push is rejected rather than mixing new code with snapshots of the old one.
          branch: ${{ steps.comment-branch.outputs.head_ref }}
          skip_fetch: true
          skip_checkout: true
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ steps.commit-and-push.outputs.changes_detected == 'true' }}
        with:
          message: ✅ Snapshots [updated](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/commits/${{ steps.commit-and-push.outputs.commit_hash }})!
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ steps.commit-and-push.outputs.changes_detected != 'true' }}
        with:
          message: ⚠️ No snapshots changes detected.
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ failure() }}
        with:
          message: 🚨 Failed to [update](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) snapshots.
