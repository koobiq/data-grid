version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    # A release is proposed only once it is a week old, so a compromised version is caught
    # before it reaches a pull request.
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - 'github/codeql-action*'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # Has to stay at least as long as npmMinimalAgeGate in .yarnrc.yml: Dependabot does not read
    # the gate when it picks a version, and yarn refuses to install a younger one. The same window
    # also holds back the transitive dependencies Dependabot resolves into the lockfile. Security
    # updates are not delayed. Our own packages are taken as soon as they are published.
    cooldown:
      default-days: 7
      exclude:
        - '@koobiq/*'
    ignore:
      # Ignores major version updates. Security updates do not read `update-types` and move a package
      # to whatever major has the fix, so the packages below are also capped by `versions`, which
      # security updates respect. Raise a bound together with the migration to the next major.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The repository builds with Angular 18.
      - dependency-name: '@angular/*'
        versions: ['>=19']
      - dependency-name: '@angular-devkit/*'
        versions: ['>=19']
      - dependency-name: '@schematics/angular'
        versions: ['>=19']
      - dependency-name: 'ng-packagr'
        versions: ['>=19']
      - dependency-name: 'angular-eslint'
        versions: ['>=19']
      # Angular 18 supports TypeScript >=5.4 <5.6, and a TypeScript minor is a breaking change.
      - dependency-name: 'typescript'
        versions: ['>=5.6']
      - dependency-name: 'nx'
        versions: ['>=21']
      - dependency-name: '@nx/*'
        versions: ['>=21']
      # The package major follows the AG Grid major.
      - dependency-name: 'ag-grid-*'
        versions: ['>=36']
    groups:
      # Security fixes come in one pull request instead of one per alert. The groups below apply to
      # version updates only: a group without `applies-to` never takes a security update.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@eslint-community/*'
          - '@types/eslint'
          - 'typescript-eslint'
          - 'angular-eslint'
          - 'globals'
      commitlint:
        patterns:
          - '@commitlint/*'
      stylelint:
        patterns:
          - 'stylelint*'
      prettier:
        patterns:
          - 'prettier*'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
          - '@swc*'
      angular:
        patterns:
          - '@angular/*'
          - 'rxjs'
          - 'zone.js'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'ng-packagr'
      koobiq:
        patterns:
          - '@koobiq/*'
      ag-grid:
        patterns:
          - 'ag-grid-*'
      jest:
        patterns:
          - 'jest*'
          - '@types/jest'
          - 'ts-jest'
          - '@testing-library/*'
