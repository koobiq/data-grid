version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    # A release is proposed only once it is a week old, so a compromised version is caught
    # before it reaches a pull request.
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - 'github/codeql-action*'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # Has to stay at least as long as npmMinimalAgeGate in .yarnrc.yml: Dependabot does not read
    # the gate when it picks a version, and yarn refuses to install a younger one. The same window
    # also holds back the transitive dependencies Dependabot resolves into the lockfile. Security
    # updates are not delayed. Our own packages are taken as soon as they are published.
    cooldown:
      default-days: 7
      exclude:
        - '@koobiq/*'
    ignore:
      # Ignores any major updates
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@eslint-community/*'
          - '@types/eslint'
          - 'typescript-eslint'
          - 'angular-eslint'
          - 'globals'
      commitlint:
        patterns:
          - '@commitlint/*'
      stylelint:
        patterns:
          - 'stylelint*'
      prettier:
        patterns:
          - 'prettier*'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
          - '@swc*'
      angular:
        patterns:
          - '@angular/*'
          - 'rxjs'
          - 'zone.js'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'ng-packagr'
      koobiq:
        patterns:
          - '@koobiq/*'
      ag-grid:
        patterns:
          - 'ag-grid-*'
      jest:
        patterns:
          - 'jest*'
          - '@types/jest'
          - 'ts-jest'
          - '@testing-library/*'
